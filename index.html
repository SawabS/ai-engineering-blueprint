/* Layout concept: Brilliant-style course page. A winding lesson map beside a course card, a focused lesson
   player, and a pannable blueprint board with the lesson docked in a side panel (bottom sheet on phones).
   Color tokens are taken from Brilliant's own light and dark design tokens. */
:root{
  /* surfaces (bg-primary, bg-secondary, bg-elevated, oat) */
  --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#F8F8F8; --oat:#F5F3F1; --hover:rgba(0,0,0,.05);
  /* text (text-primary, -secondary, -tertiary) */
  --ink:#000000; --muted:rgba(0,0,0,.6); --faint:rgba(0,0,0,.4);
  /* borders (border-solid, border-gray-primary, border-oat) */
  --line:#E5E5E5; --line-strong:#B3B3B3; --line-soft:rgba(0,0,0,.08); --grid:#DEDAD5;
  /* course accent: pastel green */
  --accent:#A6E9BE; --accent-shadow:#6FC68E; --accent-ink:#1E8549; --accent-soft:#EAF9EF; --accent-fg:#0E3B21;
  /* lesson node depth (idle = not started yet) */
  --node-idle:#E5E5E5; --node-idle-lip:#B9B9B9; --node-idle-ink:#9E9E9E; --ground:rgba(0,0,0,.12);
  /* primary CTA (bg-inverse-primary) */
  --cta:#000000; --cta-ink:#FFFFFF; --cta-shadow:#4C4C4C;
  /* streak pear */
  --pear:#D8E82E; --pear-deep:#BBCC00; --pear-ink:#000000; --pear-soft:#F7FAD5;
  /* blueprint blocks */
  --model:#6FCF95; --model-2:#A6E9BE; --model-soft:#EEFAF2; --model-t:#0E3B21; --model-ink:#1E8549;
  --hw:#383838; --hw-2:#4C4C4C;
  --serve:#456DFF; --serve-soft:#ECF0FF;
  --ctx:#FF8D23; --ctx-soft:#FFF4E9; --ctx-t:#000000;
  --know:#279B8D; --know-soft:#EAF7F6;
  --tool:#E55F45; --tool-soft:#FFF0ED;
  --harness:#BF51A0; --harness-soft:#FFF0FB;
  --ship:#009B2B;
  /* feedback (success, danger, lesson feedback sheets, select) */
  --good:#009B2B; --good-soft:#D4F5DD; --good-btn:#29CC57; --good-btn-shadow:#15B441;
  --bad:#C43939; --bad-soft:#FFEFEF; --bad-line:#E14B4B; --neutral-sheet:#E5E5E5;
  --sel:#456DFF; --sel-soft:#ECF0FF;
  --act-bg:rgba(216,232,46,.38); --band:rgba(216,232,46,.85);
  --dis-bg:rgba(0,0,0,.05); --dis-fg:rgba(0,0,0,.25);
  --bp-edge:rgba(0,0,0,.16); --bp-shadow:rgba(0,0,0,.07);
  --shadow:0 0 15px 0 rgba(0,0,0,.10); --shadow-md:0 0 25px 0 rgba(0,0,0,.2);
  --f-display:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"Source Code Pro",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-s:.75rem; --r-m:1rem; --r-l:1.25rem; --r-xl:2rem;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
code,kbd,.mono{font-family:var(--f-mono);font-size:.88em}
a{color:var(--sel)}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.hint-touch{display:none}
@media (hover:none){ .hint-mouse{display:none} .hint-touch{display:inline} .kbd-only{display:none} }

/* ---------- 3D pill buttons (Brilliant button3d) ---------- */
.btn{--b-bg:var(--surface);--b-fg:var(--ink);--b-line:var(--line);--b-sh:var(--line);
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;
  border-radius:999px;border:2px solid var(--b-line);background:var(--b-bg);color:var(--b-fg);font-weight:700;font-size:16px;line-height:1.15;
  cursor:pointer;text-decoration:none;box-shadow:0 4px 0 0 var(--b-sh);transform:translateY(0);margin-bottom:4px;
  transition:transform .08s ease, box-shadow .08s ease, filter .15s, background .15s}
.btn:hover{filter:brightness(.97)}
:root[data-theme="dark"] .btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 0 var(--b-sh)}
.btn[disabled],.btn[disabled]:hover{--b-bg:var(--dis-bg);--b-fg:var(--dis-fg);--b-line:transparent;--b-sh:transparent;cursor:not-allowed;transform:none;filter:none}
.btn-primary{--b-bg:var(--cta);--b-fg:var(--cta-ink);--b-line:var(--cta);--b-sh:var(--cta-shadow)}
.btn-accent{--b-bg:var(--accent);--b-fg:var(--accent-fg);--b-line:var(--accent);--b-sh:var(--accent-shadow)}
.btn-good{--b-bg:var(--good-btn);--b-fg:#fff;--b-line:var(--good-btn);--b-sh:var(--good-btn-shadow)}
.btn-ghost{--b-bg:transparent;--b-line:transparent;--b-sh:transparent}
.btn-ghost:hover{background:var(--hover);filter:none}
.btn-sm{min-height:36px;padding:6px 14px;font-size:14px;box-shadow:0 3px 0 0 var(--b-sh);margin-bottom:3px}
.btn-sm:active{transform:translateY(3px)}
.btn-lg{min-height:52px;padding:12px 28px;font-size:17px}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line-soft);font-size:13px;font-weight:700;color:var(--muted)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;min-width:40px;padding:0 12px;border-radius:999px;
  border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;font-size:14px;flex:none;box-shadow:0 3px 0 0 var(--line)}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn svg{width:18px;height:18px;flex:none}
.icon-btn .t{display:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px))}
.topbar .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{display:block;flex:none;width:38px;height:38px;filter:drop-shadow(0 1px 0 var(--line-soft))}
.brand .wm{display:grid;line-height:1.02;min-width:0}
.brand .wm small{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.brand .wm b{font-size:20px;font-weight:900;letter-spacing:-.025em;white-space:nowrap}
.icon-btn.gh{color:var(--ink);text-decoration:none}
.icon-btn.gh svg{width:20px;height:20px}
.foot-brand{display:flex;align-items:center;gap:10px}
.foot-brand .mark{width:28px;height:28px}
.foot-gh{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:700;text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;box-shadow:0 3px 0 0 var(--line);margin-bottom:3px}
.foot-gh:hover{background:var(--hover)}
.foot-gh:active{transform:translateY(3px);box-shadow:none}
.foot-gh svg{width:18px;height:18px}
.board-mark .mark{width:30px;height:30px}
footer.site{align-items:center}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.stat-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink)}
.stat-pill svg{width:20px;height:20px}
.stat-pill.streak{color:var(--ink)}
.stat-pill.off{color:var(--faint)}

/* ---------- course page ---------- */
.course{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:48px;align-items:start;padding-block:32px 40px}
.course-side{position:sticky;top:84px;display:grid;gap:18px;min-width:0}
.course-title{display:grid;gap:10px}
.course-title h1{font-size:clamp(30px,3.4vw,40px);font-weight:800;letter-spacing:-.025em}
.course-title p{color:var(--muted);font-size:17px;max-width:38ch}
.course-meta{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;font-size:15px}
.course-meta span{display:inline-flex;align-items:center;gap:6px}
.course-meta svg{width:18px;height:18px;color:var(--muted)}
.progress{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;border-radius:999px;background:var(--good-btn);transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.progress-row{display:grid;gap:8px}
.progress-row .lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:600}

.bp-card{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);padding:12px;box-shadow:0 4px 0 0 var(--line);min-width:0}
.bp-card .bp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 8px 6px}
.bp-card .bp-head .t{font-weight:800;font-size:15px}
.max-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);
  font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 0 0 var(--line)}
.max-btn:hover{background:var(--hover)}
.max-btn:active{transform:translateY(3px);box-shadow:none}
.max-btn svg{width:16px;height:16px}
.bp-svg-wrap{border-radius:var(--r-m);background:var(--oat);overflow:hidden}
.scrub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 4px 0}
.scrub input{width:100%;accent-color:var(--accent-ink);height:28px}
.scrub .lbl{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.scrub .lbl b{color:var(--ink)}

/* map */
.map{display:grid;gap:8px;min-width:0}
.level{position:relative;display:grid;gap:4px;min-width:0}
.level-head{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-l);background:var(--sunk);border:1px solid var(--line-soft);position:relative;z-index:1}
.level-badge{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);font-weight:900;font-size:18px;box-shadow:0 4px 0 0 var(--accent-shadow)}
.level-head .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.level-head h3{font-size:19px;font-weight:800;margin-top:1px}
.level-head p{font-size:14px;color:var(--muted);margin-top:2px}
.level-head .count{margin-left:auto;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.path{position:relative;min-width:0}
.path svg.rail{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.path svg.rail path{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.path svg.rail path.done{stroke:var(--accent)}
.stop{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:170px;
  animation:stopIn .42s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--k, 0) * 40ms)}
@keyframes stopIn{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.7)}to{opacity:1;transform:translateX(-50%)}}
/* Lesson node: a coin seen at a slight angle. The face rests on a darker lip (Brilliant's button3d:
   face translated up by the lip depth) and sinks onto it when pressed. A soft ground shadow shrinks as
   the face lifts, so hover reads as "rising" and press as "landing". */
.mnode{--w:86px;--hgt:78px;--lip:8px;--lift:var(--lip);
  --face:var(--node-idle);--lipc:var(--node-idle-lip);--ic:var(--node-idle-ink);
  position:relative;width:var(--w);height:calc(var(--hgt) + var(--lip));padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation}
.mnode::before{content:"";position:absolute;left:10%;right:10%;bottom:-7px;height:16px;border-radius:50%;
  background:radial-gradient(closest-side, var(--ground), transparent);transition:transform .22s cubic-bezier(.34,1.56,.64,1), opacity .22s}
.mnode .base,.mnode .face{position:absolute;left:0;right:0;bottom:0;height:var(--hgt);border-radius:50%}
.mnode .base{background:var(--lipc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.mnode .face{background:var(--face);color:var(--ic);display:grid;place-items:center;overflow:hidden;
  transform:translateY(calc(-1 * var(--lift)));transition:transform .24s cubic-bezier(.34,1.56,.64,1), filter .15s;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.28), inset 0 -5px 0 rgba(0,0,0,.07)}
.mnode .face::after{content:"";position:absolute;left:14%;top:8%;width:46%;height:30%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.34), transparent);pointer-events:none}
.mnode .face svg{width:40px;height:40px;position:relative;z-index:1;transition:transform .24s cubic-bezier(.34,1.56,.64,1)}
.mnode:hover{--lift:calc(var(--lip) + 3px)}
.mnode:hover .face{filter:brightness(1.05)}
.mnode:hover::before{transform:scale(.88);opacity:.75}
.mnode:active,.mnode.press{--lift:1px}
.mnode:active .face,.mnode.press .face{transition-duration:.07s;transition-timing-function:ease-out}
.mnode:active::before,.mnode.press::before{transform:scale(1.06);opacity:1;transition-duration:.07s}
.mnode:focus{outline:none}
.mnode:focus-visible .face{outline:3px solid var(--sel);outline-offset:3px}
/* done: the unit's colour, darker lip of the same hue */
.mnode.done,.mnode.next{--face:var(--accent);--lipc:var(--accent-shadow);--ic:var(--accent-fg)}
/* selection: a crisp ring around the whole coin (face + lip), centred on it, no glow */
.mnode .selring{position:absolute;left:-9px;right:-9px;top:-9px;bottom:-9px;border-radius:50%;border:3px solid var(--accent-ink);pointer-events:none;
  opacity:0;transform:scale(1.18);transition:opacity .18s, transform .3s cubic-bezier(.34,1.56,.64,1)}
.mnode.sel .selring{opacity:1;transform:none}
.mnode.sel{--lift:4px}
/* shine: one diagonal light line sweeps across the face */
.mnode .shine{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;z-index:2}
.mnode .shine::before{content:"";position:absolute;top:-30%;bottom:-30%;left:-60%;width:28%;transform:skewX(-22deg);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);opacity:0}
.mnode.flash .shine::before{animation:shine .65s ease-out 1}
.mnode.sel .shine::before{animation:shine 2.4s ease-in-out .5s infinite}
@keyframes shine{0%{left:-60%;opacity:0}12%{opacity:1}70%{opacity:1}100%{left:130%;opacity:0}}
.mnode .tick{position:absolute;right:-2px;top:-6px;z-index:2;width:28px;height:28px;border-radius:50%;background:var(--good-btn);color:#fff;display:grid;place-items:center;
  border:3px solid var(--paper);box-shadow:0 2px 0 0 var(--good-btn-shadow);transform:translateY(calc(var(--lip) - var(--lift)));transition:transform .24s cubic-bezier(.34,1.56,.64,1)}
.mnode .tick svg{width:13px;height:13px}
.start-bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);z-index:3;background:var(--accent);color:var(--accent-fg);font-weight:900;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 0 0 var(--accent-shadow);animation:bob 1.8s ease-in-out infinite;pointer-events:none}
.start-bubble::after{content:"";position:absolute;top:calc(100% - 1px);left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--accent)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.pop{position:absolute;z-index:6;width:min(320px, calc(100% - 8px));background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);padding:16px;
  box-shadow:0 4px 0 0 var(--line), var(--shadow-md);display:grid;gap:10px;transform-origin:var(--ax, 50%) -10px;animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both}
.pop::before{content:"";position:absolute;top:-9px;left:var(--ax, 50%);width:16px;height:16px;margin-left:-8px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg);border-radius:3px 0 0 0}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.stop .lab{font-weight:800;font-size:14px;text-align:center;line-height:1.25;max-width:170px}
.stop .lab small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.pop .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:700}
.pop h4{font-size:19px;font-weight:800}
.pop p{font-size:14.5px;color:var(--muted)}
.pop .acts{display:flex;gap:8px;flex-wrap:wrap}
.pop .acts .btn{flex:1 1 auto}
footer.site{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer.site a{color:var(--ink);font-weight:700}

/* ---------- blueprint svg ---------- */
.bp{display:block;width:100%;height:auto;max-width:100%}
.bp text{font-family:var(--f-body);pointer-events:none}
.bp .t-title{font-weight:800;font-size:15px}
.bp .t-sub{font-size:11.5px;opacity:.92}
.bp .t-big{font-family:var(--f-display);font-weight:900;font-size:46px;letter-spacing:-.02em}
.bp .t-frame{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;font-weight:700}
.bp-n{transition:opacity .35s ease}
.bp-n.dim{opacity:.3}
.bp-n.frame.dim{opacity:.6}
.bp-n.enter{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{opacity:0;transform:scale(.55) translateY(10px)}100%{opacity:1;transform:none}}
.bp .glow{opacity:0;fill:none;stroke:var(--accent-ink);stroke-width:2.5;stroke-dasharray:7 6;transition:opacity .2s}
.bp-n.hl .blk{stroke:var(--accent-ink)!important;stroke-width:3!important}
.bp-n.hl .glow{opacity:1;animation:flow 1.4s linear infinite}
.bp-n{transition:opacity .35s ease, filter .35s ease, transform .24s cubic-bezier(.34,1.56,.64,1)}
.bp .clickable:not(.frame):hover{transform:translateY(-3px)}
.bp .clickable:not(.frame):active{transform:translateY(2px);transition-duration:.07s}
.bp-n.sketch{filter:grayscale(1);opacity:.32}
.bp-n.sketch .blk{stroke-dasharray:6 5}
.bp-n.sketch:hover{opacity:.7;filter:grayscale(.4)}
.bp-n.sketch.hl{filter:none;opacity:1}
.bp .packet{fill:var(--accent-ink);stroke:var(--paper);stroke-width:3;pointer-events:none}
.bp .clickable{cursor:pointer}
.bp .clickable:hover .blk,.bp .clickable:focus-visible .blk{stroke:var(--accent-ink)!important;stroke-width:2.5!important}
.bp .clickable:focus{outline:none}
.bp .wire-line{stroke:var(--faint);stroke-width:3;stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.bp .ghost{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:6 6}
.bp .ghost-t{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;fill:var(--faint)}
.bp-tip{position:fixed;z-index:80;max-width:290px;background:var(--surface);color:var(--ink);border:2px solid var(--line);padding:12px 14px;border-radius:16px;font-size:13.5px;pointer-events:none;line-height:1.42;box-shadow:0 4px 0 0 var(--line), var(--shadow-md)}
.bp-tip b{display:block;font-size:15px;font-weight:800;margin-bottom:3px}
.bp-tip .st{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.bp-tip .st i{font-style:normal;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line-soft)}
.bp-tip .st i.ok{background:var(--accent);color:var(--accent-fg);border-color:var(--accent-shadow)}

/* ---------- lesson player ---------- */
.player{position:fixed;inset:0;z-index:40;background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);
  container:player / inline-size}
.p-top{display:flex;align-items:center;gap:12px;padding:12px max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px))}
.p-close{width:40px;height:40px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--muted)}
.p-close:hover{background:var(--hover);color:var(--ink)}
.p-close svg{width:18px;height:18px}
.p-progress{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden;min-width:60px}
.p-progress > div{height:100%;background:var(--good-btn);border-radius:999px;transition:width .4s cubic-bezier(.3,1.3,.5,1)}
.p-title{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
.p-xp{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:14px;color:var(--ink)}
.p-xp svg{width:18px;height:18px}
.p-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);min-height:0}
.p-main{overflow-y:auto;overflow-x:hidden;padding:24px max(16px, env(safe-area-inset-right,0px)) 40px max(16px, env(safe-area-inset-left,0px));container:lesson / inline-size}
.p-aside{border-left:1px solid var(--line);padding:20px;overflow:auto;background:var(--sunk);display:grid;gap:14px;align-content:start}
.trail{display:flex;flex-direction:column;gap:6px}
.trail-step{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.trail-step .nest{flex:none;width:22px;height:22px;display:grid;place-items:center}
.trail-step:last-child{color:var(--ink)}
.trail-step:not(:last-child){color:var(--muted)}
.zoom-card{position:relative;background:var(--oat);border:2px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.zoom-card .bp{aspect-ratio:1000/680}
.zoom-card .max-btn{position:absolute;right:8px;top:8px}
.zoom-tag{position:absolute;left:10px;top:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:600}
.aside-note{font-size:14px;color:var(--muted)}
.aside-note strong{color:var(--ink)}

.step{max-width:640px;margin:0 auto;animation:stepIn .4s ease both}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.step > .eyebrow{color:var(--accent-ink)}
.step h2{font-size:clamp(24px,3vw,30px);font-weight:800;margin:6px 0 16px}
.beat{animation:beatIn .45s cubic-bezier(.2,.9,.3,1) both}
.beat + .beat{margin-top:14px}
@keyframes beatIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.prose{font-size:17px;line-height:1.6;max-width:62ch}
.prose > * + *{margin-top:12px}
.prose code{background:var(--sunk);border:1px solid var(--line-soft);padding:1px 6px;border-radius:6px}
.prose strong{font-weight:800}
.prose .k{font-weight:800;color:var(--ink);background:linear-gradient(var(--band),var(--band)) 0 100%/100% .3em no-repeat}
.callout{margin-top:14px;border:2px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--surface);font-size:15.5px}
.callout .eyebrow{margin-bottom:4px}
.more-dots{display:flex;justify-content:center;gap:6px;margin-top:18px}
.more-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.more-dots i.on{background:var(--ink)}

/* widgets */
.widget{margin-top:18px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);padding:18px;min-width:0}
.widget .w-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.widget .w-head .eyebrow{color:var(--accent-ink)}
.w-hint{font-size:13.5px;color:var(--muted)}
.w-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.w-col{display:grid;gap:10px}
.w-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ctrl{display:grid;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted);min-width:0}
.ctrl input[type=range]{width:100%;accent-color:var(--accent-ink);height:28px}
.ctrl .v{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line-soft);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14), 0 0 0 2px var(--sel) inset}
.chips-scroll{display:flex;gap:8px;flex-wrap:wrap}
.chips-scroll .btn{flex:none}
.swipe-hint{display:none;font-size:12.5px;color:var(--faint);margin-top:6px}
.mono-box{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.55;color:var(--ink)}
.mono-box .dim{color:var(--faint)}
.mono-box .hot{background:var(--act-bg);border-radius:3px}
.mono-box .tk{color:var(--accent-ink);font-weight:600}
.scroll-x{overflow-x:auto;max-width:100%}
.txt-in{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;background:var(--paper);color:var(--ink)}
.txt-in:focus{border-color:var(--sel);outline:none}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.bar-row .lab{font-family:var(--f-mono);font-size:13.5px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:22px;background:var(--sunk);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:var(--model);border-radius:999px;transition:width .35s ease, background .2s}
.bar-row.cut .bar-fill{background:var(--line-strong)}
.bar-row.cut .lab,.bar-row.cut .pct{opacity:.45;text-decoration:line-through}
.bar-row.pick .bar-fill{background:var(--good-btn)}
.bar-row .pct{font-family:var(--f-mono);font-size:12.5px;text-align:right;color:var(--muted)}
.toks{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--f-mono);font-size:14px;direction:ltr}
.tok{padding:3px 7px;border-radius:7px;white-space:pre;border:1.5px solid transparent}
.tok:nth-child(5n+1){background:color-mix(in srgb, var(--model) 22%, transparent)}.tok:nth-child(5n+2){background:color-mix(in srgb, var(--ctx) 26%, transparent)}.tok:nth-child(5n+3){background:color-mix(in srgb, var(--know) 24%, transparent)}
.tok:nth-child(5n+4){background:color-mix(in srgb, var(--tool) 22%, transparent)}.tok:nth-child(5n+5){background:color-mix(in srgb, var(--serve) 20%, transparent)}
.stat-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.stat-row b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--ink);display:block;line-height:1.1}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px;font-size:16.5px;line-height:1.4;box-shadow:0 4px 0 0 var(--line);margin-bottom:4px;transition:transform .08s, box-shadow .08s}
.opt:hover{background:var(--hover)}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt .key{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--sel);background:var(--sel-soft);box-shadow:0 4px 0 0 var(--sel)}
.opt.sel .key{border-color:var(--sel);background:var(--sel);color:#fff}
.opt.right{border-color:var(--good-btn);background:var(--good-soft);box-shadow:0 4px 0 0 var(--good-btn-shadow)}
.opt.right .key{border-color:var(--good-btn);background:var(--good-btn);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft);box-shadow:0 4px 0 0 var(--bad-line)}
.opt.wrong .key{border-color:var(--bad-line);background:var(--bad-line);color:#fff}
.opt[disabled]{cursor:default}
.opt[disabled]:active{transform:none}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .node{flex:1 1 110px;border:2px solid var(--line);border-radius:14px;padding:10px;font-size:13.5px;background:var(--paper);min-width:0;transition:all .25s}
.flow .node b{display:block;font-size:14px}
.flow .node.on{border-color:var(--c, var(--sel));background:color-mix(in srgb, var(--c, var(--sel)) 14%, var(--surface));transform:translateY(-2px)}
.flow .arrow{align-self:center;color:var(--faint);font-weight:700}
.chatlog{display:grid;gap:8px}
.msg{border-radius:16px;padding:10px 12px;font-size:14.5px;max-width:92%;border:2px solid var(--line);background:var(--paper);min-width:0;overflow-wrap:anywhere}
.msg .role{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px;font-weight:600}
.msg.user{justify-self:end;background:var(--sel-soft);border-color:transparent}
.msg.system{background:var(--ctx-soft);border-color:transparent}
.msg.tool{background:var(--tool-soft);border-color:transparent;font-family:var(--f-mono);font-size:13px}
.msg.call{background:var(--accent-soft);border-color:transparent;font-family:var(--f-mono);font-size:13px}
.msg.asst{background:var(--surface)}
.msg.new{animation:beatIn .35s ease both}
.sortgame{display:grid;gap:10px}
.sort-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--paper)}
.sort-item.ok{border-color:var(--good-btn);background:var(--good-soft)}
.sort-item.no{border-color:var(--bad-line);background:var(--bad-soft)}
.sort-item .seg button{font-size:13px;padding:6px 10px}
.rank{display:grid;gap:6px}
.rank-row{display:grid;grid-template-columns:30px minmax(0,1fr) 120px;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--paper);font-size:14px;transition:all .3s}
.rank-row.in{border-color:var(--know);background:var(--know-soft)}
.rank-row .n{font-family:var(--f-mono);font-weight:700;color:var(--muted);text-align:center}
.rank-row .sc{display:grid;gap:3px}
.minibar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.minibar > i{display:block;height:100%;background:var(--know)}
.minibar.sp > i{background:var(--ctx)}
.minibar.hy > i{background:var(--harness)}
.rank-row .doc b{font-size:13.5px}
.rank-row .doc span{color:var(--muted);font-size:13px}
.code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border:1px solid var(--line-soft);border-radius:12px;padding:10px 0;overflow-x:auto;line-height:1.7}
.code .ln{display:block;padding:0 14px;white-space:pre;border-left:4px solid transparent}
.code .ln.act{background:var(--act-bg);border-left-color:var(--pear-deep)}
.code .c{color:var(--faint)}
.gantt{display:grid;gap:6px;font-size:12px}
.gantt-row{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:center}
.gantt-track{position:relative;height:24px;background:var(--sunk);border-radius:6px}
.gantt-seg{position:absolute;top:3px;bottom:3px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;overflow:hidden}
.heat{display:grid;gap:2px}
.heat .cell{aspect-ratio:1;border-radius:3px;min-width:0;cursor:pointer}
.heat .lab{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
.attn-sent{display:flex;flex-wrap:wrap;gap:6px 4px;font-size:18px;line-height:2}
.attn-w{padding:2px 7px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:background .2s}
.attn-w.q{border-color:var(--ink)}
.attn-w.fut{opacity:.35;cursor:default}
.gpu-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gpu{width:64px;height:78px;border-radius:10px;background:var(--hw);position:relative;overflow:hidden;border:2px solid var(--bp-edge)}
.gpu > i{position:absolute;left:0;right:0;bottom:0;background:var(--model)}
.gpu span{position:absolute;inset:auto 0 4px 0;text-align:center;color:#fff;font-size:10px;font-weight:700;font-family:var(--f-mono)}
.membar{display:flex;height:30px;border-radius:999px;overflow:hidden;background:var(--sunk);border:2px solid var(--line);margin-top:10px}
.membar > div{height:100%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;transition:width .3s}
.verdict{margin-top:12px;font-weight:700;font-size:15px;padding:10px 12px;border-radius:14px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.svgchart{width:100%;height:auto;display:block}
.svgchart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:16px}
.mini-card{border:2px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--surface);font-size:14px;box-shadow:0 3px 0 0 var(--line)}
.mini-card b{display:block;font-family:var(--f-display);font-size:16px;font-weight:800;margin-bottom:4px}
.mini-card span{color:var(--muted)}
.chunks{line-height:1.9;font-size:15px}
.chunks .ch{border-radius:5px;padding:2px 0}
.trace{display:grid;gap:5px;font-size:13px}
.trace-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:10px;align-items:center;cursor:pointer;border-radius:8px;padding:2px 4px}
.trace-row:hover,.trace-row.on{background:var(--sunk)}
.trace-row .nm{font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace-track{position:relative;height:18px}

/* lesson footer: Brilliant feedback sheet */

<div id="app"></div>
<script>
/* ================= sound (Web Audio, synthesized, no files) =================
   Soft, low, rounded sounds: wooden "tocks", bubble pops and marimba notes, all through a
   gentle low-pass so nothing is sharp or high-pitched. Every sound follows a user action. */
const SFX = (() => {
  let ctx = null, out = null, noiseBuf = null, lastTick = 0, lastTap = 0;

  function ensure() {
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return null;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        ctx = new AC();
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.5;
        const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
        out = ctx.createGain(); out.gain.value = 0.6;
        out.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }
  function env(g, s, peak, attack, dur) {
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(peak, s + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
  }
  function osc(f, t, dur, { type = 'sine', gain = 0.12, attack = 0.004, to = null, lp = null } = {}) {
    const c = ensure(); if (!c) return;
    const s = c.currentTime + t; const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, s); if (to) o.frequency.exponentialRampToValueAtTime(to, s + dur * 0.8);
    env(g, s, gain, attack, dur);
    let n = o; if (lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; o.connect(f2); n = f2; }
    n.connect(g); g.connect(out); o.start(s); o.stop(s + dur + 0.03);
  }
  function noise(t, dur, { gain = 0.04, freq = 600, q = 0.7, to = null, type = 'lowpass' } = {}) {
    const c = ensure(); if (!c) return;
    const s = c.currentTime + t; const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, s); f.Q.value = q; if (to) f.frequency.exponentialRampToValueAtTime(to, s + dur);
    const g = c.createGain(); env(g, s, gain, 0.008, dur);
    src.connect(f); f.connect(g); g.connect(out); src.start(s); src.stop(s + dur + 0.03);
  }
  // marimba-like mallet: warm fundamental, quick wooden overtone, soft knock
  function mallet(f, t = 0, dur = 0.5, gain = 0.13) {
    osc(f, t, dur, { gain, attack: 0.003 });
    osc(f * 3.98, t, 0.07, { gain: gain * 0.18, attack: 0.002 });
    osc(f * 2, t, dur * 0.35, { gain: gain * 0.12, attack: 0.003 });
  }
  // C major pentatonic, C3 to E5: warm, mid-range
  const PENTA = [130.81, 146.83, 164.81, 196.0, 220.0, 261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25];
  const note = i => PENTA[Math.max(0, Math.min(PENTA.length - 1, i))];

  const S = {
    // a soft wooden "tok": the default press
    tap() { const n = performance.now(); if (n - lastTap < 50) return; lastTap = n; osc(560, 0, 0.075, { gain: 0.22, to: 340 }); noise(0, 0.03, { gain: 0.05, freq: 1400 }); },
    // a rounder, quieter tok for switches
    toggle() { osc(470, 0, 0.065, { gain: 0.17, to: 300 }); },
    // a bubble pop for choosing an answer
    select() { osc(380, 0, 0.11, { gain: 0.22, to: 640, attack: 0.002 }); },
    // slider detent: barely there
    tick(frac = 0.5) { const n = performance.now(); if (n - lastTick < 60) return; lastTick = n; osc(320 + frac * 260, 0, 0.03, { gain: 0.07, to: 260 }); },
    // reading on: a soft page-turn breath plus a mallet note
    reveal() { noise(0, 0.15, { gain: 0.05, freq: 500, to: 1200, type: 'bandpass', q: 0.6 }); mallet(523.25, 0.02, 0.3, 0.1); },
    next() { noise(0, 0.16, { gain: 0.045, freq: 450, to: 1100, type: 'bandpass', q: 0.6 }); osc(330, 0, 0.13, { gain: 0.13, to: 440 }); },
    back() { noise(0, 0.15, { gain: 0.04, freq: 1100, to: 450, type: 'bandpass', q: 0.6 }); osc(440, 0, 0.12, { gain: 0.12, to: 330 }); },
    // correct: three warm mallet notes rising (C5 E5 G5)
    correct() { mallet(523.25, 0, 0.5, 0.16); mallet(659.25, 0.1, 0.5, 0.16); mallet(783.99, 0.2, 0.8, 0.17); },
    // not quite: a low, muffled double knock, never harsh
    wrong() { osc(294, 0, 0.15, { type: 'triangle', gain: 0.2, lp: 800 }); osc(220, 0.12, 0.26, { type: 'triangle', gain: 0.18, lp: 650, to: 196 }); },
    // the Continue button just unlocked
    unlock() { mallet(659.25, 0, 0.55, 0.12); },
    // each produced token climbs the pentatonic scale
    token(i = 0) { mallet(note(6 + (i % 7)), 0, 0.35, 0.14); },
    // a run of samples: likely tokens high, rare tokens low
    burst(ranks) { ranks.forEach((k, j) => mallet(note(12 - Math.min(7, k)), j * 0.055, 0.22, 0.08)); },
    open() { noise(0, 0.26, { gain: 0.05, freq: 350, to: 1100, type: 'bandpass', q: 0.5 }); mallet(392.0, 0.05, 0.4, 0.1); },
    close() { noise(0, 0.22, { gain: 0.045, freq: 1100, to: 350, type: 'bandpass', q: 0.5 }); },
    // a block lands on the blueprint: soft thud with a wooden knock on top
    block() { osc(150, 0, 0.22, { gain: 0.24, to: 75 }); osc(340, 0, 0.06, { gain: 0.1, to: 240 }); noise(0, 0.07, { gain: 0.05, freq: 500 }); },
    // lesson complete: rising arpeggio, the block lands, a warm chord
    complete() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, k) => mallet(f, k * 0.11, 0.6, 0.13));
      setTimeout(() => S.block(), 470);
      [261.63, 329.63, 392.0, 523.25].forEach(f => osc(f, 0.55, 1.1, { gain: 0.05, attack: 0.05 }));
    },
    error() { osc(220, 0, 0.12, { type: 'triangle', gain: 0.12, lp: 600 }); }
  };
  return S;
})();

document.addEventListener('click', e => {

  if (!t || t.disabled) return;
  if (t.closest('#p-foot') || t.dataset.sfx === 'none' || t.classList.contains('opt')) return;
  if (t.closest('.seg')) { SFX.toggle(); return; }
  if (t.classList.contains('bp-n') || t.closest('.bp-n')) { SFX.block(); return; }
  if (t.classList.contains('cell')) { SFX.tick(0.6); return; }
  SFX.tap();
}, true);
document.addEventListener('input', e => {
  const r = e.target;
  if (r && r.type === 'range') { const min = +r.min || 0, max = +r.max || 1; SFX.tick((+r.value - min) / ((max - min) || 1)); }
}, true);

    added: 'The output head: logits → softmax → sampled token',

      { kind: 'learn', title: 'A score for every possible token',
        body: `<p>Feed the model <code>The capital of France is</code>. Its last layer emits one raw score, a <span class="k">logit</span>, for every entry in its vocabulary, which typically holds 100,000 to 200,000 tokens.</p>
<p><span class="k">Softmax</span> turns scores into probabilities: each score is divided by a <span class="k">temperature</span> T, exponentiated, and normalised so everything sums to 1. Low T exaggerates the gaps between scores. High T flattens them. Move the slider, then sample.</p>`,

      { kind: 'learn', title: 'The knobs in every API',
        body: `<p>You now understand every generation parameter you will meet in a provider's documentation. They all act on the output head and the decoding loop, and none of them changes the weights.</p>
<div class="cards3">
<div class="mini-card"><b>temperature</b><span>Sharpens or flattens the distribution. Low for extraction and code, higher for brainstorming.</span></div>

{
  title: 'Inside the house', side: 'the model', color: 'var(--accent)', where: 'Blueprint: the house interior',
  blurb: 'Tokenizers, embeddings, attention and training. How the function in the house is built.',

  {
    id: 'tokens', title: 'Tokens and embeddings', sub: 'How text becomes numbers', short: 'the tokenizer',
    trail: ['The whole system', 'The model', 'Tokenizer → embeddings'], hl: ['tok'],
    added: 'A tokenizer and an embedding table at the ground floor',
    recap: 'Text is split into subword tokens, each token becomes an integer ID, and each ID becomes a learned vector. Languages the tokenizer rarely saw pay more tokens per sentence.',
    steps: [
      { kind: 'learn', title: 'The model never sees letters',
        body: `<p>Before anything reaches the network, a <span class="k">tokenizer</span> cuts text into pieces from a fixed vocabulary and replaces each piece with an integer ID. Most modern tokenizers use <span class="k">byte-pair encoding</span>: start from bytes and repeatedly merge the most frequent adjacent pair in a training corpus, until the vocabulary is full.</p>
<p>Common words become one token. Rare words become several. Text the corpus barely contained falls apart into bytes. Try the presets, including the Sorani Kurdish one, and watch the counts.</p>`,

        body: '<p>The Sorani greeting and its English translation say the same thing, yet the Sorani version costs several times more tokens. What explains this?</p>',
        options: ['Kurdish is intrinsically more complex, so it always needs more tokens', 'The tokenizer learned its merges mostly from English-heavy text, so Kurdish words split into small fragments', 'Arabic-script text is sent to the model as images', 'Non-English text is translated into English before tokenizing'],
        answer: 1,
        why: { 0: 'Token counts measure the tokenizer, not the language. A tokenizer trained on Kurdish text would cut the same sentence into far fewer pieces.', 2: 'Text models receive token IDs for every script.', 3: 'No hidden translation happens. The raw text is tokenized directly.' },
        explain: 'Frequent strings in the tokenizer\'s training data become single tokens; rare ones fall back to short pieces. Under-represented languages therefore pay more in cost, latency and context space, and the model sees their words as fragments. That is why teams train language-specific tokenizers or extend vocabularies.' },

    id: 'attention', title: 'Attention', sub: 'How tokens read each other', short: 'transformer blocks',

    recap: 'Attention lets each token pull information from earlier tokens, weighted by relevance. MLPs transform each token on its own. Stacking dozens of these blocks turns embeddings into a prediction.',

      { kind: 'learn', title: 'Each token asks a question',
        body: `<p>Inside each block, every token produces three vectors: a <span class="k">query</span> (what am I looking for?), a <span class="k">key</span> (what do I contain?) and a <span class="k">value</span> (what do I hand over if chosen?). A token compares its query with every earlier key, softmaxes the scores into weights, and takes a weighted average of the values.</p>

      { kind: 'learn', title: 'No peeking at the future',
        body: `<p>During training the model sees whole sentences, yet it must learn to predict each token from the ones before it. A <span class="k">causal mask</span> enforces this: token <em>i</em> may only attend to positions 1 through <em>i</em>. Click a row to see what one token is allowed to read.</p>`,

        body: `<p>A transformer block has two halves. <span class="k">Attention</span> moves information <em>between</em> tokens. The <span class="k">MLP</span> (feed-forward network) transforms each token <em>on its own</em> and holds roughly two thirds of the parameters; much factual association lives there.</p>
<p>Both halves add their output onto a running vector per token, the <span class="k">residual stream</span>. A model stacks 30 to over 100 such blocks. Attention is also split into many <span class="k">heads</span> that each learn a different kind of relation, such as syntax, coreference or copying.</p>
<div class="cards3">
<div class="mini-card"><b>Embeddings</b><span>One vector per token enters the stack.</span></div>
<div class="mini-card"><b>× N blocks</b><span>Attention, then MLP, each added to the residual stream.</span></div>

<p><span class="k">Supervised fine-tuning (SFT)</span> trains on curated conversations, so the model learns the chat format and the habit of answering. <span class="k">Reinforcement learning</span> then optimises against preference judgments (RLHF, DPO) and, increasingly, verifiable rewards such as passing tests or reaching a correct maths answer, which is how reasoning models learn to think at length.</p>`,

        body: `<p>Full fine-tuning updates every weight and needs memory for gradients and optimiser state several times the model's size. <span class="k">LoRA</span> freezes the original weights and learns small low-rank matrices beside them, often well under one percent of the parameter count. Adapters can be swapped per customer or task at serving time.</p>
<div class="cards3">

<div class="mini-card"><b>Not worth it</b><span>Fresh facts, per-user data, anything you can solve with a better prompt or retrieval.</span></div>

        body: '<p>When you fine-tune with LoRA, which parameters change?</p>',
